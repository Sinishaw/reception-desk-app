<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Concierge | Visitor Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#36485b",
                        "surface-dim": "#ecd5cc",
                        "on-primary-fixed-variant": "#7a3000",
                        "secondary-container": "#cfe2f9",
                        "surface-tint": "#a04100",
                        "secondary-fixed": "#d1e4fb",
                        "primary-container": "#c45100",
                        "on-primary-fixed": "#351000",
                        "inverse-surface": "#3b2d27",
                        "primary-fixed-dim": "#ffb693",
                        "primary-fixed": "#ffdbcc",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#aac7ff",
                        "on-tertiary-container": "#fefcff",
                        "outline-variant": "#e0c0b2",
                        "on-background": "#251913",
                        "surface-container-highest": "#f5ded4",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#ffb693",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#fff1eb",
                        "outline": "#8c7166",
                        "on-tertiary-fixed-variant": "#00458d",
                        "background": "#fff8f6",
                        "secondary": "#4e6073",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#001b3e",
                        "tertiary": "#005ab4",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "surface-variant": "#f5ded4",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#ffede6",
                        "tertiary-container": "#0073e1",
                        "surface-bright": "#fff8f6",
                        "secondary-fixed-dim": "#b5c8df",
                        "primary": "#9c3f00",
                        "on-surface-variant": "#584238",
                        "surface": "#fff8f6",
                        "on-surface": "#251913",
                        "tertiary-fixed": "#d6e3ff",
                        "on-secondary-container": "#526478",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#ffeae1",
                        "surface-container-high": "#fbe3da",
                        "on-secondary-fixed": "#091d2e",
                        "on-primary-container": "#fffbff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "display": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .active-nav-icon { font-variation-settings: 'FILL' 1; }
        .input-active-indicator:focus-within { border-bottom: 2px solid #9c3f00; }
        .glass-panel { background: rgba(255, 234, 225, 0.6); backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen selection:bg-primary/20">
<div class="flex min-h-screen">
<!-- SideNavBar from SCREEN_26 -->
<aside class="hidden md:flex flex-col h-screen w-80 bg-surface-container-low dark:bg-surface-dim py-8 px-6 gap-y-6 fixed left-0 top-0 z-40">
<div class="flex items-center gap-4 px-2">
<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[32px]">architecture</span>
</div>
<div>
<h1 class="text-xl font-black text-on-surface dark:text-on-surface-variant leading-tight">Concierge Onyx</h1>
<p class="font-body font-semibold text-xs text-secondary">Architectural Concierge</p>
</div>
</div>
<nav class="flex flex-col gap-y-2 mt-8">
<!-- Dashboard Active -->
<div class="flex items-center gap-4 px-4 py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-xl shadow-lg scale-100 active:scale-95 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined active-nav-icon" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-body font-semibold text-sm">Dashboard</span>
</div>
<div class="group flex items-center gap-4 px-4 py-3 text-secondary dark:text-secondary-fixed-dim hover:text-primary hover:bg-surface-container-highest transition-all duration-200 rounded-xl cursor-pointer scale-100 active:scale-95">
<span class="material-symbols-outlined">recent_actors</span>
<span class="font-body font-semibold text-sm">Visitor Log</span>
</div>
<div class="group flex items-center gap-4 px-4 py-3 text-secondary dark:text-secondary-fixed-dim hover:text-primary hover:bg-surface-container-highest transition-all duration-200 rounded-xl cursor-pointer scale-100 active:scale-95">
<span class="material-symbols-outlined">badge</span>
<span class="font-body font-semibold text-sm">Staff Management</span>
</div>
<div class="group flex items-center gap-4 px-4 py-3 text-secondary dark:text-secondary-fixed-dim hover:text-primary hover:bg-surface-container-highest transition-all duration-200 rounded-xl cursor-pointer scale-100 active:scale-95">
<span class="material-symbols-outlined">analytics</span>
<span class="font-body font-semibold text-sm">Analytics</span>
</div>
</nav>
<div class="mt-auto">
<button class="w-full py-4 px-6 bg-secondary-container text-on-secondary-container font-bold rounded-xl flex items-center justify-center gap-3 hover:bg-secondary-container/80 transition-all">
<span class="material-symbols-outlined">add_circle</span>
                    New Registration
                </button>
</div>
</aside>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col md:ml-80">
<!-- TopAppBar -->
<header class="bg-[#fff8f6] dark:bg-[#1a110d] flex justify-between items-center w-full px-8 md:px-16 py-8 h-24 z-50 sticky top-0">
<div class="text-2xl font-black text-[#251913] dark:text-[#fff8f6]">Concierge</div>
<div class="flex items-center gap-6">
<button class="text-[#4e6073] dark:text-[#a5b4c1] hover:bg-[#ffeae1] dark:hover:bg-[#3d2b24] transition-colors p-2 rounded-full scale-95 duration-150">
<span class="material-symbols-outlined">help</span>
</button>
<button class="text-[#4e6073] dark:text-[#a5b4c1] hover:bg-[#ffeae1] dark:hover:bg-[#3d2b24] transition-colors p-2 rounded-full scale-95 duration-150">
<span class="material-symbols-outlined">info</span>
</button>
</div>
</header>
<div class="flex-grow flex items-center justify-center px-6 py-12 md:py-24">
<div class="w-full max-w-2xl relative z-10">
<!-- Progress Indicator -->
<div class="mb-12 flex items-center justify-between px-2">
<div class="flex flex-col items-start gap-2">
<span class="text-xs font-bold tracking-widest text-primary uppercase">Step 01 of 03</span>
<h1 class="text-4xl md:text-5xl font-bold tracking-tight text-on-surface">Visitor Details</h1>
</div>
<div class="flex gap-2">
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-12 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 w-12 rounded-full bg-surface-container-highest"></div>
</div>
</div>
<!-- Registration Form Card -->
<div class="bg-surface-container-low rounded-xl p-8 md:p-12 shadow-sm">
<form class="space-y-8">
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<!-- Building & Floor Search -->
<div class="flex flex-col gap-2 group md:col-span-2">
<label class="text-sm font-semibold text-secondary px-1">Building &amp; Floor</label>
<div class="bg-surface-container-highest rounded-lg transition-all input-active-indicator relative flex items-center">
<span class="material-symbols-outlined text-secondary ml-4">location_on</span>
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-medium" list="building-floors" placeholder="Search building or floor..." type="text"/>
<datalist id="building-floors">
<option value="Building A - Level 1"></option>
<option value="Building A - Level 2"></option>
<option value="Building B - Level 1"></option>
<option value="Building B - Level 4"></option>
<option value="Building C - Lobby"></option>
<option value="East Tower - Floor 10"></option>
<option value="West Wing - Basement"></option>
</datalist>
</div>
</div>
<!-- Full Name -->
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-secondary px-1">Full Name</label>
<div class="bg-surface-container-highest rounded-lg transition-all input-active-indicator">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-medium" placeholder="e.g. Julianne Moore" type="text"/>
</div>
</div>
<!-- Company -->
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-secondary px-1">Company</label>
<div class="bg-surface-container-highest rounded-lg transition-all input-active-indicator">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-medium" placeholder="e.g. Design Studio Inc." type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-secondary px-1">Email Address</label>
<div class="bg-surface-container-highest rounded-lg transition-all input-active-indicator">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-medium" placeholder="julianne@example.com" type="email"/>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-secondary px-1">Phone Number</label>
<div class="bg-surface-container-highest rounded-lg transition-all input-active-indicator">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-medium" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Purpose of Visit -->
<div class="flex flex-col gap-2 md:col-span-2 group">
<label class="text-sm font-semibold text-secondary px-1">Purpose of Visit</label>
<div class="bg-surface-container-highest rounded-lg transition-all input-active-indicator relative">
<select class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface font-medium appearance-none">
<option disabled="" selected="" value="">Select a purpose...</option>
<option value="meeting">Scheduled Meeting</option>
<option value="delivery">Delivery / Courier</option>
<option value="interview">Job Interview</option>
<option value="maintenance">Maintenance / Service</option>
<option value="other">Other</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-secondary">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Identification -->
<div class="flex flex-col gap-2 md:col-span-2 group">
<label class="text-sm font-semibold text-secondary px-1">Identification</label>
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-highest border-2 border-dashed border-outline/20 hover:border-primary/50 text-on-surface-variant font-bold py-4 rounded-lg transition-all group/upload" type="button">
<span class="material-symbols-outlined text-primary group-hover/upload:scale-110 transition-transform">badge</span>
<span>Upload Identification</span>
</button>
<p class="text-[10px] text-outline px-1">Accepted formats: JPG, PNG, PDF (Max 5MB)</p>
</div>
</div>
<!-- Actions -->
<div class="pt-8 flex flex-col md:flex-row items-center justify-between gap-6">
<button class="text-primary font-bold hover:underline transition-all px-4 py-2" type="button">
                                    Cancel Registration
                                </button>
<button class="w-full md:w-auto bg-gradient-to-br from-primary to-primary-container text-on-primary px-12 py-5 rounded-lg font-bold text-lg shadow-xl shadow-primary/10 hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-3" type="submit">
                                    Next Step
                                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Architectural Quote/Accent -->
<div class="mt-16 text-center opacity-30 select-none">
<p class="font-headline tracking-[0.3em] text-xs font-black uppercase text-secondary">Precision in Hospitality</p>
</div>
</div>
</div>
</main>
<!-- Side Graphic (Desktop only) -->
<div class="hidden lg:block fixed right-0 top-0 bottom-0 w-1/4 h-full pointer-events-none">
<div class="w-full h-full relative">
<div class="absolute inset-0 bg-surface-container opacity-40"></div>
<img class="w-full h-full object-cover mix-blend-multiply opacity-20" data-alt="abstract architectural close-up of warm wood panels and glass with soft sunlight filtering through a high-end corporate lobby" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-UKE-9vQyOVKigI8sf213A3u2QGO-mA-AwYc0dqyGid030j1l0f8xK-37DFw2QW4rUk0sSpIbyOx6-8vTBI23bkfcud5FhkvQTW9l3TolWE-qHscJlGIQE0mBCBlK8umG6yLGNvNcV4YfVfhXhzunLsQiedIcILbwnXAQ3p_AR535KVE0vzfsZhYCv4tBStvyh_ONxvIOMSPYY5FYeEqYIeQgx9hrGxd8Mnok07aWHLTZT7VGah4YOGrjf0Y5y2JOLQM3noW5PGxI"/>
<div class="absolute inset-0 bg-gradient-to-l from-transparent to-surface"></div>
</div>
</div>
</div>
</body></html>
